- name: sandbox
  rest: separate Sandbox API credentials against the same base URL; verifications run against static Test Entities
    and are not chargeable
  mcp: 'OAuth session mode Sandbox (VerificationType: Demo); anonymous synthetic data at /mock/mcp'
