key_formats:
  note: No key-prefix convention is published; Sandbox and Live are distinguished by which Client Id / Secret pair
    was issued, and MCP sessions by the mode the server reports in trulioo_health.
test_values:
  test_entities: Static Test Entities configured per package and country; list them with getTestEntities (GET /v3/configuration/testentities/{configurationName}/{countryCode})
    or the MCP tool config_list_test_entities (deprecated in favour of sandbox_seed_scenario). No literal test-entity
    values are published on the public docs.
  mcp_scenarios: sandbox_seed_scenario returns a content-addressed scn_ id; "bodies cap at 16 KiB, 50 per caller,
    15-minute expiry"
time_simulation: null
triggers: MCP sandbox scenarios let the caller register the outcome a later verify should produce (seed -> verify
  -> reset); REST test entities return match/no-match per field by comparison against the static entity attributes.
gaps:
- No published test-entity catalogue (values live in the customer portal)
- Document Verification has no static sandbox; DocV testing goes through the SDK session flow
- No test clocks or time simulation
