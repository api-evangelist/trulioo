name: Trulioo sandbox and test environments
provider: Trulioo
providerId: trulioo
description: 'Trulioo separates Sandbox and Live by API credentials rather than by host: a Sandbox credential set
  runs every verification against predefined static Test Entities instead of live data sources ("These transactions
  are not chargeable and do not reflect in the monthly billing"), and test transactions appear in transaction review
  and performance reports labelled Demo. Test entities are managed in the portal and readable through GET /v3/configuration/testentities/{configurationName}/{countryCode}.
  The sandbox article applies to Identity Verification and Business Verification only, not Document Verification.
  The hosted MCP server adds an anonymous synthetic endpoint (https://mcp.trulioo.com/mock/mcp, no auth) and an
  OAuth "Sandbox" session mode with seedable scenarios.'
