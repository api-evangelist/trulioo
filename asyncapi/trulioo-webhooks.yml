name: Trulioo Platform webhooks (Event Dispatcher)
provider: Trulioo
providerId: trulioo
description: Workflow Studio flows push JSON events to one customer Callback URL configured through the Export API
  step in the builder (one callback per workflow; route further on your server). Events cover the end-client journey
  through a hosted flow (flow start/end, step and service submissions, DocV intermediate events, abandonment) and
  Client Manager manual actions (accept, reject, pending review, notes, tasks). Event payloads for Person Match,
  DocV and UBO/PSC connector transactions are shown in the Event Dispatcher reference. The REST verification APIs
  (v3) are request/response with status polling and publish no webhook of their own. No AsyncAPI document is published.
asyncapi_published: false
docs: https://developer.trulioo.com/reference/event-dispatcher
delivery:
  transport: HTTPS POST, JSON body, to the configured Callback URL
  signature:
    header: x-trulioo-signature
    algorithm: HMAC-SHA256 of the webhook message using the shared secret key, hex encoded
    secret: obtained from the Trulioo team (support@trulioo.com); not self-serve
    docs: https://developer.trulioo.com/reference/hmac
  acknowledgement: Upon receiving a webhook notification, you should acknowledge success by responding with an HTTP
    20x response within 10 seconds.
  retries: 'Retry schedule is not published; the payload carries a retry counter ("retry": 0) and delivery is at-least-once'
  duplicates: We guarantee at-least-once delivery of webhooks, which means that in rare occasions you may receive
    duplicate events. You should treat events as idempotent to avoid unwanted effects in your application.
  ordering: Trulioo doesn't guarantee order when delivering events. As a result, you may receive an event before
    another event that was created earlier.
  ip_allowlist: mentioned as an alternative to signature validation (allow requests from Trulioo's IP address);
    the IP list itself is not on the public docs
subscription: Callback URL(s) subscribe to event types; the list of event types "can be enriched at any moment,
  without prior notice"
events:
