vocabulary:
  name: Trulioo operational vocabulary
  description: Operational vocabulary for the Trulioo GlobalGateway and Trulioo Platform. Captures the canonical
    terms used across the Verifications, Configuration, Connection, Business Verification, Person Fraud, Document
    Verification, and Platform APIs.
  version: '0.1'
  terms:
  - term: GlobalGateway
    definition: Trulioo's single-API gateway across 450+ datasources in 195+ countries.
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Configuration Name
    definition: Customer-configured product name (e.g. "Identity Verification") that selects datasource bundles,
      fields, and rules.
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Datasource
    definition: An individual underlying data provider that contributes to a verification (credit bureau, government,
      utility, telco, watchlist).
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Datasource Result
    definition: Per-datasource breakdown of which fields matched.
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Record Status
    definition: Aggregate verdict for a verification record (match, nomatch, partial, error).
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Rule
    definition: A configured matching rule (e.g. "1+1" or "1+1+SSN") that determines whether a record qualifies
      as match.
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Transaction Record
    definition: Persistent record of one verification, retrievable by TransactionRecordID.
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Appended Field
    definition: Additional data returned by a datasource that was not in the request (e.g. credit-bureau-confirmed
      address).
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Consent
    definition: End-user consent text required by certain datasources before submission.
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Jurisdiction Of Incorporation
    definition: The state, province, or country in which a business is registered (US-DE, GB, CA-BC, etc).
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Known Faces
    definition: Biometric watchlist of enrolled faces; used to detect repeat fraudsters.
    tags:
    - concept
    source: https://developer.trulioo.com
  - term: Workflow Studio
    definition: Trulioo's low-code and API-driven orchestrator for verification flows.
