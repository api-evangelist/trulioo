tools_documented_note: Names as published at https://mcp.trulioo.com/developer/index.md (Tools reference, 2026-10-01
  machine map). The docs state the product contract is 51 tools and that per-account families are absent from tools/list
  until the deployment is entitled to them; this manifest did not call the live /mcp endpoint, only the anonymous
  mock, which returned the 18 tools above.
prompts:
- name: kyc_onboarding_workflow
  description: Step-by-step KYC identity verification workflow
  arguments:
  - name: country_code
    description: ISO 3166-1 alpha-2 country code
  - name: package_id
    description: Trulioo package UUID
- name: kyb_due_diligence_workflow
  description: Step-by-step KYB business due diligence workflow
  arguments:
  - name: business_name
    description: Legal name of the business
  - name: country_code
    description: ISO 3166-1 alpha-2 country code
- name: aml_investigation_workflow
  description: AML watchlist screening and risk decision workflow
  arguments:
  - name: entity_type
    description: '''person'' or ''business'''
- name: age_verification_workflow
  description: 3-rung age assurance ladder workflow
  arguments:
  - name: age_threshold
    description: Minimum required age, e.g. 18
- name: docv_verification_workflow
  description: SDK-mediated document verification workflow with handoff and polling
  arguments:
  - name: country_code
    description: ISO 3166-1 alpha-2 country code
  - name: capture_method
    description: auto, eid, document, or liveness
- name: monitoring_enrollment_workflow
  description: Business monitoring enrollment, alert checking, and cancellation workflow
  arguments:
  - name: entity_name
    description: Name of the business to monitor
resources:
- name: KYC transaction record
  uri: trulioo://kyc/{id}
  description: Retrieve a KYC verification record by transaction record ID
  mimeType: null
- name: DocV transaction
  uri: trulioo://kyc/docv/{id}
  description: Retrieve a document verification transaction by ID
  mimeType: null
- name: EID verification
  uri: trulioo://kyc/eid/{id}
  description: Retrieve an EID verification transaction by ID
  mimeType: null
- name: Age assurance result
  uri: trulioo://kyc/age/{id}
  description: Retrieve an age assurance result by transaction record ID
  mimeType: null
- name: Configuration context
  uri: trulioo://config/{pkg}/{cc}
  description: Package+country configuration context (recommended fields, consents, test entities). Cacheable at
    host level.
  mimeType: null
- name: KYB transaction record
  uri: trulioo://kyb/{id}
  description: Retrieve a business verification record by transaction record ID
  mimeType: null
- name: KYB business report
  uri: trulioo://kyb/report/{id}
  description: Descriptor for a business report by record ID. The report is a PDF fetched out-of-band, not inlined
    (Finding K).
  mimeType: null
- name: Monitoring enrollment
  uri: trulioo://kyb/monitoring/{id}
  description: Retrieve a business monitoring enrollment by enrollment ID
  mimeType: null
- name: AML screening result
  uri: trulioo://aml/{id}
  description: Retrieve an AML screening result by transaction record ID
  mimeType: null
- name: Horizon deep-research run
  uri: trulioo://horizon/run/{run_id}
  description: Retrieve a Horizon deep-research run by run_id (poll kyb_get_research for the live status/result).
  mimeType: null
- name: KYA Agentic Release
  uri: trulioo://kya/software-artifacts/releases/{release_id}
  description: Read one immutable Agentic Release and its computed package digests.
  mimeType: null
- name: KYA Agentic Release status
  uri: trulioo://kya/software-artifacts/releases/{release_id}/status
  description: Read the current lifecycle, standing, admission projection, and optimistic-concurrency version for
    an Agentic Release.
  mimeType: null
- name: KYA Agentic Release receipt
  uri: trulioo://kya/software-artifacts/releases/{release_id}/receipt
  description: Read the signed immutable KYA receipt for an Agentic Release when issuance is complete.
  mimeType: null
- name: KYA Agentic Release digest lookup
  uri: trulioo://kya/software-artifacts/digests/{digest}
  description: Resolve a sha256 package or distribution digest to its immutable Agentic Release.
  mimeType: null
- name: Sandbox scenario
  uri: trulioo://scenarios/{scenario_id}
  description: 'Read back one seeded sandbox scenario: the inputs, the declared outcome, the ids it runs as, and
    when it expires. Scoped to the caller that seeded it. Sandbox sessions only.'
  mimeType: null
- name: Agent readiness latest run
  uri: trulioo://kya/readiness/latest/{host}
  description: 'Read the newest recorded agent-readiness run for one host: reason codes, per-check residuals, the
    vantage it was measured from, and whether it may be published. No score or ranking is emitted. Entitlement is
    unchanged from the assessment tool.'
  mimeType: null
- name: Active sandbox scenarios
  uri: trulioo://scenarios/active
  description: List the sandbox scenarios this caller has seeded and not yet reset, newest first, with the published
    caps. Sandbox sessions only.
  mimeType: application/json
- name: KYA issuer current signing keys
  uri: trulioo://kya/issuer/jwks.json
  description: Read Halo's current issuer JWKS for agent and Agentic Release receipt verification.
  mimeType: application/json
- name: KYA issuer DID document
  uri: trulioo://kya/issuer/did.json
  description: Read Halo's resolved did:webvh document with current version-qualified issuer keys.
  mimeType: application/json
- name: KYA issuer key history
  uri: trulioo://kya/issuer/did.jsonl
  description: Read Halo's append-only hash-chained did:webvh key history to resolve rotated receipt keys.
  mimeType: application/jsonl
- name: KYA Agentic Release signed tree head
  uri: trulioo://kya/software-artifacts/transparency/sth
  description: Read the current signed tree head for independent Agentic Release transparency verification and gossip.
  mimeType: application/json
- name: KYA Agentic Release transparency keys
  uri: trulioo://kya/software-artifacts/transparency/jwks.json
  description: Read the current and historical keys used only to verify Agentic Release signed tree heads.
  mimeType: application/json
- name: TypeScript tool bindings
  uri: trulioo://bindings/typescript
  description: Generated TypeScript wrappers for every tool on THIS instance, for code-execution clients. Each wrapper
    already routes correctly (advertised tools by name, deferred tools via trulioo_invoke_tool).
  mimeType: text/x-typescript
