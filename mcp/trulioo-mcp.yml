    type: object
- name: kyc_verify
  description: '[WRITE] Verify a person. Call config_describe_context first for this country''s exact, case-sensitive
    field names. A hit or non-match is a POTENTIAL result for human review, never an automated adverse decision
    on a person alone (GDPR Art. 22 / OFAC valid-match / FCRA); report the evidence and recommend review.'
  annotations:
    title: Verify a person (KYC)
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      consents:
        description: Array of consent NAME values (the `Name` field of each entry in config_describe_context.consents[],
          e.g. "MockCredit") - NOT the human-readable consent Text and NOT a boolean
        items:
          type: string
        type: array
      country_code:
        description: ISO 3166-1 alpha-2, e.g. US. A name, an alpha-3 or a common spelling (`USA`, `UK`) is canonicalized
          before dispatch
        type: string
      data_fields:
        description: Trulioo verification data. Call config_describe_context first to get exact field names for
          this country
        type: object
      include_aml:
        description: 'Add AML watchlist screening. Default: false'
        type: boolean
      package_id:
        description: Package UUID from config_discover_account
        type: string
      scenario_id:
        description: Sandbox only. Bind a scenario from sandbox_seed_scenario so this call returns that scenario's
          outcome. Omit to let the surname conventions decide
        type: string
      wait_for_completion:
        description: 'Poll until final result (max 30s). Default: false'
        type: boolean
    required:
    - package_id
    - country_code
    - data_fields
    type: object
- name: transaction_lookup
  description: '[READ-ONLY] Resolve a KYC or KYB transaction id to its normalized record and supported next action.'
  annotations:
    title: Look up a transaction record
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      domain:
        description: Optional result-domain hint; otherwise auto-detected.
        enum:
        - kyc
        - kyb
        type: string
      record_id:
        description: Known TransactionRecordID; skips status lookup.
        type: string
      transaction_id:
        description: TransactionID or TransactionRecordID. Either resolves.
        type: string
    required:
    - transaction_id
    type: object
- name: kyb_search
  description: '[READ-ONLY] Find a business by name and country and return ranked candidates to choose from, then
    pass the chosen candidate to kyb_verify.'
  annotations:
    title: Search for a business
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      business_name:
        type: string
      business_registration_number:
        description: Optional known BRN/registration number to narrow the search (nested under Business, not BusinessDataFields)
        type: string
      country_code:
        description: ISO 3166-1 alpha-2, e.g. US. A name, an alpha-3 or a common spelling (`USA`, `UK`) is canonicalized
          before dispatch
        type: string
      location:
        description: Optional address fields to narrow results. StateProvinceCode is a code; a name is canonicalized
          before the search runs, including on the name-variant retries.
        type: object
      package_id:
        description: Trulioo package UUID from config_discover_account
        type: string
    required:
    - package_id
    - business_name
    - country_code
    type: object
- name: kyb_verify
  description: '[WRITE] Verify a business from known fields or a search candidate; profile controls ownership. A
    hit or non-match is a POTENTIAL result for human review, never an automated adverse decision on a person alone
    (GDPR Art. 22 / OFAC valid-match / FCRA); report the evidence and recommend review.'
  annotations:
    title: Verify a business (KYB)
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      business_data_fields:
        description: NAPI identity fields from config_describe_context; Location is an array.
        type: object
      candidate_id:
        description: Row id; needs candidate_ref.
        type: string
      candidate_ref:
        description: kyb_search selection.ref plus candidate_id; expires in 15 minutes.
        type: string
      candidate_search_package_id:
        description: Search package; defaults to package_id.
        minLength: 1
        type: string
      country_code:
        description: ISO 3166-1 alpha-2, e.g. US. A name, an alpha-3 or a common spelling (`USA`, `UK`) is canonicalized
          before dispatch
        type: string
      enhanced_profile:
        description: Provisioned profile override.
        type: boolean
      entities:
        description: Override ownership inclusion.
        type: boolean
      from_candidate:
        description: Unsigned fallback. Prefer candidate_ref plus candidate_id.
        type: object
      include_aml:
        description: AML screening; default false.
        type: boolean
      package_id:
        type: string
      profile:
        description: 'Provisioned tier: essentials=(false,false), insights=(true,false), complete=(true,true/UBO).'
        enum:
        - essentials
        - insights
        - complete
        type: string
      scenario_id:
        description: Sandbox only. Bind a scenario from sandbox_seed_scenario so this call returns that scenario's
          outcome. Omit to let the surname conventions decide
        type: string
      ubo_discovery:
        description: Provisioned profile=complete.
        type: boolean
    required:
    - package_id
    - country_code
    type: object
- name: config_discover_account
  description: '[READ-ONLY] List normalized account packages, or inspect one package and its supported countries.'
  annotations:
    title: Discover account packages
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      package_id:
        description: Optional. When provided, also returns the country codes this package is configured for.
