  note: 'The .NET stdio server (install: dotnet run inside src/Trulioo.MCPServerForKYB after cloning; configured
    via appsettings.json ClientId/ClientSecret) is a separate, older KYB-only server with four tools (TestAuthentication,
    GetCountries, BusinessVerification, BusinessSearch). It is built from source, not shipped on a package registry.
    The hosted endpoint is the primary agent surface.'
auth:
  type: oauth2.1
  live: POST https://mcp.trulioo.com/oauth/token with HTTP Basic client_id:client_secret and grant_type=client_credentials
    -> short-lived bearer (expires_in 3600, no refresh token)
  sandbox: OAuth 2.1 authorization code + PKCE (S256); dynamic client registration at https://mcp.trulioo.com/register;
    authorize https://mcp.trulioo.com/authorize; token https://mcp.trulioo.com/token
  protected_resource_metadata: https://mcp.trulioo.com/.well-known/oauth-protected-resource/mcp
  authorization_server_metadata: https://mcp.trulioo.com/.well-known/oauth-authorization-server
  scopes_supported:
