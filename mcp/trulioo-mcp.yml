name: Trulioo MCP Server
provider: Trulioo
providerId: trulioo
description: Trulioo hosts a streamable-HTTP MCP server at https://mcp.trulioo.com/mcp exposing typed KYC, KYB,
  AML, document verification, age assurance, business monitoring, account analytics and Know Your Agent (KYA) tools,
  plus workflow prompts and resources. Live access requires OAuth 2.1 (authorization code + PKCE with dynamic client
  registration for sandbox; client_credentials exchange at /oauth/token for approved live accounts). An anonymous
  synthetic endpoint at https://mcp.trulioo.com/mock/mcp answers tools/list without credentials and was probed for
  this manifest. Trulioo also publishes an older .NET 8 stdio MCP server for KYB on GitHub (trulioo/mcp-server)
  and a signed Agent Plugins 1.0.0 bundle (trulioo/trulioo-mcp, v0.7.5) that connects Claude Code, Codex, ChatGPT
  and Claude Desktop to the hosted endpoint.
deployment:
  mode: both
  endpoint: https://mcp.trulioo.com/mcp
  transport: streamable-http
  mock_endpoint: https://mcp.trulioo.com/mock/mcp
  install: dotnet run
  package: https://github.com/trulioo/mcp-server
  plugin:
    marketplace: /plugin marketplace add Trulioo/trulioo-mcp
    install: /plugin install trulioo-mcp@trulioo
    codex: codex plugin marketplace add Trulioo/trulioo-mcp --ref v0.7.5
    version: 0.7.5
    registry_manifest: https://raw.githubusercontent.com/trulioo/trulioo-mcp/HEAD/server.json
    registry_name: com.trulioo/trulioo-mcp
    license: Apache-2.0
  auth: oauth
  verified: probed
