- name: trulioo_find_tools
  description: '[READ-ONLY] Find deferred tools by capability.'
  annotations:
    title: Find tools by keyword
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    additionalProperties: false
    properties:
