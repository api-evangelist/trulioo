        type: string
      limit:
        description: Max results (default 25, max 100).
        maximum: 100
        minimum: 1
        type: integer
      query:
        description: Free-text terms matched against tool names, purpose, and guidance (e.g. 'watchlist', 'ownership',
          'agent mandate'). Omit to list everything.
        maxLength: 512
        type: string
    type: object
- name: trulioo_tool_schema
  description: '[READ-ONLY] Read a tool''s full schema and guidance.'
  annotations:
    title: Read a tool's full schema
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    additionalProperties: false
    properties:
      names:
        description: One tool name or an array of tool names from trulioo_find_tools. Max 8 per call; ask for the
          ones you intend to call, not the whole server.
        oneOf:
        - minLength: 1
