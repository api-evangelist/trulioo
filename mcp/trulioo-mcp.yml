- name: config_describe_context
  description: '[READ-ONLY] Return required fields, consent, and data sources for one package and country.'
  annotations:
    title: Describe package context
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      country_code:
        description: Country; normalized to alpha-2 or refused.
        type: string
      package_id:
        type: string
    required:
    - package_id
    - country_code
    type: object
- name: config_list_test_entities
  description: '[READ-ONLY] List the sandbox scenarios this caller holds. DEPRECATED - use sandbox_seed_scenario.'
  annotations:
    title: List held sandbox scenarios (deprecated)
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      country_code:
        description: Country; normalized to alpha-2 or refused.
        type: string
      package_id:
        description: 'Trulioo package UUID from config_discover_account. Still required, still validated, but no
          longer narrows the answer: scenarios are scoped to the caller, not to a package+country.'
        type: string
      surface:
        description: RETIRED. There is no persona list left to filter, so any value is refused rather than ignored.
          Pass surface to sandbox_seed_scenario instead.
        type: string
    required:
    - package_id
    - country_code
    type: object
- name: sandbox_reset_scenarios
  description: '[DESTRUCTIVE] Reset seeded scenarios'
  annotations:
    title: Reset seeded scenarios
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: true
    openWorldHint: false
  inputSchema:
    additionalProperties: false
    properties: {}
    type: object
- name: kya_retire_agent
  description: '[DESTRUCTIVE] Retire a DAP; to replace one instead, call kya_supersede_agent.'
  annotations:
    title: Retire an agent (KYA)
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      fingerprint:
        description: The fingerprint of the agent to retire.
        type: string
    required:
    - fingerprint
    type: object
- name: kya_revoke_mandate
  description: '[DESTRUCTIVE] Revoke a mandate''s spend authority.'
  annotations:
    title: Revoke a mandate (KYA)
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      mandate_id:
        description: The mandate to revoke, as returned by kya_issue_mandate.
        type: string
      reason:
        description: Why, for the audit trail an operator reads later (e.g. 'agent key leaked'), and optional -
          it defaults to 'manual'
        type: string
    required:
    - mandate_id
    type: object
- name: kya_revoke_artifact
  description: '[DESTRUCTIVE] Revoke a compromised Agentic Release.'
  annotations:
    title: Revoke an Agentic Release (KYA)
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: true
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    description: Permanently revoke a release's standing.
    properties:
      domain:
        description: Currently verified publisher domain.
        maxLength: 253
        type: string
      event_id:
        description: Durable idempotency key for this transition.
        maxLength: 256
        type: string
      expected_version:
        description: Current status version from the artifact status resource. Prevents lost updates.
        minimum: 0
        type: integer
      reason_code:
        description: Stable audit reason code.
        maxLength: 256
        type: string
      release_id:
        description: The already-registered release to transition - the release_id returned at registration, never
          a new value to mint here
        maxLength: 256
        type: string
    required:
    - release_id
    - expected_version
    - event_id
    - reason_code
    - domain
    type: object
