- name: trulioo_invoke_tool
  description: '[WRITE] Call a deferred tool under its normal access gates.'
  annotations:
    title: Invoke a tool by name
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: true
  inputSchema:
    additionalProperties: false
    properties:
      arguments:
        description: The target tool's arguments object, exactly as its own input schema defines it.
        type: object
      name:
        description: Target tool name. Must be a tool this deployment can dispatch; it cannot widen the profile
          or re-enable a disabled family.
        type: string
    required:
