error_envelope:
  shape: HTTP status plus a JSON body; service-, record- and field-level errors are carried inside the verification
    record as numbered codes
  families:
    http: 400 BadRequest, 401 Unauthorized, 408 Request Timeout, 415 Unsupported Media Type, 500 Internal Server
      Error, 503 Service Unavailable (reference/errors#http-errors)
    service_errors: 1000-1xxx codes in Record.DatasourceResults (Provider Error, Missing Required Field, Datasource
      Unavailable, Datasource Error, Missing Consent...)
    validation_codes: 3000-3xxx address validation codes
    record_level: 1002, 1006, 1007, 1008 ... on the record
    platform_errors: 4000-4xxx Workflow Studio codes (Flow not found, Node not found, Missing data for required
      element...)
    get_transaction_record: 2004 Transaction Not Available, 2005 Authentication Error
  docs: https://developer.trulioo.com/reference/errors
  artifact: errors/trulioo-error-codes.yml
  mcp: Errors are returned as typed results, not thrown; branch on status (match | review | nomatch), is_terminal
    and next_action.
