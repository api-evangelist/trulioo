name: Trulioo API conventions
provider: Trulioo
providerId: trulioo
authentication:
  style: OAuth 2.0 bearer token (client_credentials)
  rest: 'POST https://auth-api.trulioo.com/connect/token with client_id, client_secret, grant_type=client_credentials,
    scope=napi.api; send Authorization: Bearer on every request. Platform (/customer/v2) calls obtain a token from
    POST /customer/v2/auth/customer (postAuthCustomer); access tokens expire in one hour with a refresh endpoint
    for the same transaction.'
  mtls: https://developer.trulioo.com/reference/connecting-to-trulioos-api-using-mutual-tls
  mcp: OAuth 2.1 + PKCE (sandbox) or client_credentials at https://mcp.trulioo.com/oauth/token (live)
  docs: authentication/trulioo-authentication.yml
idempotency:
  coverage: none
  mechanism: null
  header: null
  retention: null
  docs: https://developer.trulioo.com/reference/webhook
  note: 'No Idempotency-Key or client-reference replay protection is documented on any of the 20 mutating REST operations
    (verifyPerson, businessVerify, documentVerificationVerify, personFraudCheck, the Known Faces and End Client
    writes). The idempotency guidance Trulioo publishes is on the consumer side of webhooks: "We guarantee at-least-once
    delivery of webhooks ... You should treat events as idempotent". On the MCP surface kya_record_spend de-duplicates
    on settlement_id (a replay with the same amount returns recorded: false; the same id with a different amount
    is refused 409) and sandbox_seed_scenario is content-addressed, but those are KYA/sandbox tools, not the verification
    writes.'
reversibility:
  grade: documented
  summary: Verification transactions (verifyPerson, businessVerify, documentVerificationVerify, personFraudCheck)
    are consumed data-source queries with no cancel, void or refund operation; a transaction cannot be reversed
    once submitted. Reversal paths exist only on side resources, with no stated window.
  surfaces:
  - write: verifyPerson / businessVerify / documentVerificationVerify / personFraudCheck
    reversal: null
    window: null
    note: No reversal operation; sandbox credentials are the only way to run a transaction that is not chargeable
  - write: postKnownFacesList / addKnownFacesListTransaction
    reversal: deleteKnownFacesList (DELETE /v3/knownfaces/lists/{listId})
    window: null
    note: Delete only; no restore documented
  - write: createLinkedLead
    reversal: deleteLinkedLead (DELETE /customer/v2/endclients/link)
    window: null
  - write: end-client profiles
    reversal: deleteEndClientsBulk (POST /customer/v2/endclients/bulkdelete) / updateEndClientsStatusBulk
    window: null
    note: Bulk delete and status change; no undelete documented
  - write: docv_create_session (MCP, per-account family)
    reversal: docv_cancel_session
    window: null
    docs: https://mcp.trulioo.com/developer/index.md
  - write: monitoring_enroll (MCP, per-account family)
    reversal: monitoring_cancel
    window: null
    docs: https://mcp.trulioo.com/developer/index.md
  - write: kya_issue_mandate / kya_publish_artifact (MCP KYA)
    reversal: kya_revoke_mandate (with a recorded reason) / kya_revoke_artifact ("permanently revoke an immutable
      Agentic Release") / kya_retire_agent
    window: null
    docs: https://mcp.trulioo.com/developer/index.md
    note: Revocation is permanent per the docs; kya_supersede_agent rotates rather than reverses
  note: No reversal window is stated anywhere in the docs, so no surface reaches the verified grade.
