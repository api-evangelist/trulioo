- code: '3005'
  status: null
  title: One or more of Unit Number, Building Number, or Street are either invalid or missing
  type: validation-code
  family: validation
  description: The street level data for the address is incomplete or invalid and will impact address validation’s
    ability to validate down to the street, building, or unit level.
- code: '3008'
  status: null
  title: Cannot validate address
  type: validation-code
  family: validation
  description: The address you sent cannot be validated by our address validation service. As a result the uncorrected
    address information provided in the original request will be sent to all other datasources. This address information
    may be incomplete or incorrect, which increases the likelihood of receiving a service error from one of the
    other datasources and reduces the likelihood of receiving a match on address values. This code can be returned
    both as a datasource level error Trulioo Service/DataSource Level Errors and a record level error Record Level
    Errors when it occurs.
- code: '3100'
  status: null
  title: Blurry Image
  type: validation-code
  family: validation
  description: Relevant to Document Verification only. When trying to verify a document, image quality is highly
    important. This error code indicates that the provided image was too blurry to verify. Please retake the image-in-focus
    and resend the verification request with the new image.
- code: '3101'
  status: null
  title: Glare Image
  type: validation-code
  family: validation
  description: Relevant to Document Verification only. When trying to verify a document, image quality is highly
    important. This error code indicates that the provided image was too blurry to verify. Please retake the image
    in good lighting without flash and resend the verification request with the new image. All text on the ID should
    be readable and not obstructed by a glare spot.
- code: '4001'
  status: null
  title: Missing Required Field Mobile Number
  type: validation-code
  family: validation
  description: Relevant to MobileID only. This error occurs if a mobile number is not present in the request. Make
    sure that at least one of the Mobile related fields (Mobile Number or Telephone) are entered.
- code: '4002'
  status: null
  title: Invalid Mobile Number
  type: validation-code
  family: validation
  description: Relevant to Mobile ID only. This error occurs if the mobile number entered in the request is not
