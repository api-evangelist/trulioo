- code: '3000'
  status: null
  title: Address Verification Level
  type: validation-code
  family: validation
  description: 'This error indicates which level provided address was verified to. If any address values were changed
    or added, the corresponding `3001-3005` validation codes will be returned along with the code `3000`. Address
    Verification Level can be one of the following: * Fully Validated to unit * Fully Validated to building * Partially
    Validated to building * Partially Validated to street * Partially Validated to city * Partially Validated to
    state/province * Address Corrected This code is only visible when reviewing transactions in our API-Direct portal.'
- code: '3001'
  status: null
  title: State / Province / County changed, please check Address validation fields for additional information
  type: validation-code
  family: validation
  description: The state/province/region in the provided address was found to be incorrect, given the other address
    values such as city or postal code, and has been updated to a new value.
- code: '3002'
  status: null
  title: One or more of City, Municipality, Suburb have been changed please check Address Validation fields for
    additional information
  type: validation-code
  family: validation
  description: The city in the provided address was found to be incorrect, given other address values such as postal
    code, and has been updated to a new value.
- code: '3003'
  status: null
  title: One or more of Unit Number, Building Number, or Street have been changed please check Address Validation
    fields for additional
  type: validation-code
  family: validation
  description: The street in the provided address has been updated with a new value based upon the other address
    data given.
- code: '3004'
  status: null
  title: Postal Code changed, please check Address Validation fields for additional information
  type: validation-code
  family: validation
  description: The postal code in the provided address has been updated with a new value based upon the other address
