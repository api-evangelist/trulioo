name: Trulioo error reference
provider: Trulioo
providerId: trulioo
format: custom
envelope:
  http: standard HTTP status codes; 4xx for request content/structure problems, 5xx for Trulioo-side problems
  record: Service, record-level and validation codes are numeric codes carried inside the verification Record (DatasourceResults
    / Errors) of a 200 response, not HTTP statuses
  platform: Workflow Studio (/customer/v2) errors use 4xxx codes with a message
families:
  http: HTTP errors (400/401/408/415/500/503)
  service: 1000-series Service / DataSource level errors
  validation: 3000-series address Validation Codes
  record: Record Level Errors
  platform: 4000-series Workflow Studio Platform Errors
  transaction-record: Get Transaction Record errors (2004, 2005)
  verify-response: Verify Response Errors
problem_count: 80
