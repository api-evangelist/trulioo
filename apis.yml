name: Trulioo
kind: company
description: Trulioo is a Vancouver-based global identity verification platform that operates GlobalGateway, a single-API
  gateway into 450+ data sources across 195+ countries for person verification (KYC), business verification (KYB), watchlist
  and PEP screening, identity document verification (DocV), biometric face match, and fraud-intelligence risk scoring. The
  Trulioo Platform layers Workflow Studio (hosted and low-code), reusable end-client profiles, event-driven webhooks, native
  mobile and web capture SDKs, and an MCP server on top of the underlying Verifications and Business APIs.
